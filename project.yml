name: iXadrez
options:
  bundleIdPrefix: com.vidi
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  iXadrez:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iXadrez
    scheme:
      testTargets:
        - iXadrezTests
        - iXadrezUITests
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "Xadrez"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Sora-Regular.ttf
          - Sora-SemiBold.ttf
          - Sora-Bold.ttf
          - Sora-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iXadrez
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S769436W24
  iXadrezTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iXadrezTests
    dependencies:
      - target: iXadrez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iXadrezTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: S769436W24
  iXadrezUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iXadrezUITests
    dependencies:
      - target: iXadrez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iXadrezUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: S769436W24
